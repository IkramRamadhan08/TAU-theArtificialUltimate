name: Build and Release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-x11-dev libxcb-cursor-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libfontconfig-dev libwayland-dev wayland-protocols \
            libx11-dev libx11-xcb-dev libasound2-dev libfreetype-dev \
            libglib2.0-dev libpango1.0-dev libatk1.0-dev libgdk-pixbuf-2.0-dev \
            libgtk-3-dev libharfbuzz-dev
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            editor/target
          key: linux-release-${{ hashFiles('editor/Cargo.lock') }}
          restore-keys: linux-release-
      - name: Set release channel
        run: echo "stable" > crates/tau/RELEASE_CHANNEL
      - name: Set build metadata
        run: echo "TAU_COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --release -p tau -p cli
        env:
          RELEASE_CHANNEL: stable
          TAU_BUNDLE: "true"
          RUSTFLAGS: "-C link-args=-Wl,--disable-new-dtags,-rpath,$ORIGIN/../lib"
      - name: Bundle shared libraries
        run: |
          mkdir -p dist/tau.app/lib
          ldd target/release/tau | awk '/=>/ { print $3 }' | while read lib; do
            case "$lib" in
              libc.so|libgcc_s.so|libm.so|libpthread.so|libdl.so) continue ;;
              *) cp "$lib" dist/tau.app/lib/ 2>/dev/null || true ;;
            esac
          done
      - name: Strip binary
        run: |
          strip -s target/release/tau
          strip -s target/release/cli
      - name: Package
        working-directory: .
        run: |
          mkdir -p dist/tau.app/libexec dist/tau.app/bin
          cp editor/target/release/tau dist/tau.app/libexec/tau-editor
          cp editor/target/release/cli dist/tau.app/bin/tau
          # Copy bundled libs from editor/dist/ (Bundle step runs in editor/ working dir)
          cp -r editor/dist/tau.app/lib dist/tau.app/ 2>/dev/null || true
          chmod +x dist/tau.app/libexec/tau-editor dist/tau.app/bin/tau
          tar cJf tau-x86_64-linux.tar.xz -C dist tau.app
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: tau-x86_64-linux.tar.xz
          retention-days: 1

  build-macos:
    name: Build (macOS ARM64)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-release-${{ hashFiles('editor/Cargo.lock') }}
          restore-keys: macos-release-
      - name: Set release channel
        run: echo "stable" > crates/tau/RELEASE_CHANNEL
      - name: Set build metadata
        run: echo "TAU_COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --release -p tau -p cli
        env:
          RELEASE_CHANNEL: stable
          TAU_BUNDLE: "true"
      - name: Strip binary
        run: |
          strip -x target/release/tau
          strip -x target/release/cli
      - name: Package
        working-directory: .
        run: |
          # Create minimal .app bundle for Spotlight/Finder integration
          APP="TAU.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp editor/target/release/tau "$APP/Contents/MacOS/tau"
          cp editor/target/release/cli "$APP/Contents/MacOS/tau-cli"
          chmod +x "$APP/Contents/MacOS/tau" "$APP/Contents/MacOS/tau-cli"
          python3 -c "
          import json, plistlib, sys
          plist = {
              'CFBundleExecutable': 'tau',
              'CFBundleIdentifier': 'ai.tau.TAU',
              'CFBundleName': 'TAU',
              'CFBundleDisplayName': 'TAU',
              'CFBundleVersion': '1.0.0',
              'CFBundleShortVersionString': '1.0.0',
              'CFBundlePackageType': 'APPL',
              'CFBundleSupportedPlatforms': ['MacOSX'],
              'LSMinimumSystemVersion': '11.0',
              'NSHighResolutionCapable': True,
              'CFBundleDocumentTypes': [{
                  'CFBundleTypeRole': 'Editor',
                  'LSHandlerRank': 'Alternate',
                  'LSItemContentTypes': ['public.folder', 'public.plain-text', 'public.text'],
              }],
          }
          with open('$APP/Contents/Info.plist', 'wb') as f:
              plistlib.dump(plist, f)
          "
          tar czf tau-aarch64-macos.tar.gz "$APP"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: tau-aarch64-macos.tar.gz
          retention-days: 1

  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Enable long paths
        working-directory: .
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-release-${{ hashFiles('editor/Cargo.lock') }}
          restore-keys: windows-release-
      - name: Set release channel
        shell: bash
        run: echo "stable" > crates/tau/RELEASE_CHANNEL
      - name: Set build metadata
        shell: bash
        run: echo "TAU_COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Build release
        run: cargo build --release -p tau -p cli
        env:
          RUSTFLAGS: "-Ctarget-feature=+crt-static -D warnings"
          RELEASE_CHANNEL: stable
          TAU_BUNDLE: "true"
      - name: Package
        working-directory: .
        run: |
          copy editor\target\release\tau.exe tau-x86_64-windows.exe
          copy editor\target\release\cli.exe tau-cli-x86_64-windows.exe
          Compress-Archive -Path tau-x86_64-windows.exe,tau-cli-x86_64-windows.exe -DestinationPath tau-x86_64-windows.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: tau-x86_64-windows.zip
          retention-days: 1

  release:
    name: Create Release
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -n "$PREV_TAG" ]; then
            echo "## What's Changed" > release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD >> release_notes.md
            echo "" >> release_notes.md
            echo "" >> release_notes.md
          else
            echo "## Initial Release" > release_notes.md
            echo "" >> release_notes.md
          fi
          
          echo "## Install" >> release_notes.md
          echo "" >> release_notes.md
          echo '### Linux / macOS' >> release_notes.md
          echo '```bash' >> release_notes.md
          echo 'curl -fsSL https://raw.githubusercontent.com/IkramRamadhan08/TAU-theArtificialUltimate/main/editor/script/install.sh | bash' >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo '### Windows (PowerShell)' >> release_notes.md
          echo '```powershell' >> release_notes.md
          echo "powershell -c \"& { \$(Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/IkramRamadhan08/TAU-theArtificialUltimate/main/editor/script/install.ps1' -UseBasicParsing).Content | Invoke-Expression }\"" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Binaries" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | File |" >> release_notes.md
          echo "|----------|------|" >> release_notes.md
          echo "| Linux x86_64 | \`tau-x86_64-linux.tar.xz\` |" >> release_notes.md
          echo "| macOS ARM64 | \`tau-aarch64-macos.tar.gz\` |" >> release_notes.md
          echo "| Windows x86_64 | \`tau-x86_64-windows.zip\` |" >> release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TAU ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/linux-x86_64/tau-x86_64-linux.tar.xz
            artifacts/macos-arm64/tau-aarch64-macos.tar.gz
            artifacts/windows-x86_64/tau-x86_64-windows.zip
